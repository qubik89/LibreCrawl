services:
  mitmore-seo-crawl:
    build: .
    container_name: mitmore-seo-crawl
    depends_on:
      - clickhouse
      - postgres
    expose:
      - "5000"
    volumes:
      # Persist the user database and settings
      - ./data:/app/data
    environment:
      - FLASK_APP=main.py
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY}
      # Set to "true" for local mode (no authentication), "false" for production
      # Defaults to "false" — local mode disables all auth and grants admin to everyone
      - LOCAL_MODE=${LOCAL_MODE:-false}
      # Set to "true" to disable new user registrations
      - REGISTRATION_DISABLED=${REGISTRATION_DISABLED:-false}
      - DISABLE_GUEST=${DISABLE_GUEST:-false}
      # Set to "true" for demo mode (1.5GB per-user memory limit)
      - DEMO_MODE=${DEMO_MODE:-false}
      # Explicit opt-in for the V2 report generation workflow.
      - REPORTS_V2_ENABLED=${REPORTS_V2_ENABLED:-false}
      # DANGEROUS: Set to "true" to allow login as any username with no password
      # (username only used to separate sessions). Do NOT use in production.
      - DANGEROUSLY_SKIP_AUTH=${DANGEROUSLY_SKIP_AUTH:-false}
      # Optional large-crawl analytics sink
      - CLICKHOUSE_ENABLED=${CLICKHOUSE_ENABLED:-true}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-mitmore_seo_crawl}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_SECURE=${CLICKHOUSE_SECURE:-false}
      - CRAWL_RESULT_STORAGE=${CRAWL_RESULT_STORAGE:-clickhouse}
      # Optional PostgreSQL metadata store. Empty keeps SQLite for auth/settings/crawl metadata.
      - METADATA_DATABASE_URL=${METADATA_DATABASE_URL:-}
      # Uncomment these for SMTP sending
      # - SMTP_HOST=${SMTP_HOST}
      # - SMTP_PORT=${SMTP_PORT}
      # - SMTP_USER=${SMTP_USER}
      # - SMTP_PASSWORD=${SMTP_PASSWORD}
      # - SMTP_FROM=${SMTP_FROM}
      # - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      # Add this for correct links in the verification emails
      # - MAIN_APP_URL=${MAIN_APP_URL}
    restart: unless-stopped
    # Increase shared memory size for Chrome to prevent crashes
    shm_size: '2gb'
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.http-0-mpzxekpy8qkkf76rc700791e.entryPoints=http
      - traefik.http.routers.http-0-mpzxekpy8qkkf76rc700791e.middlewares=redirect-to-https
      - traefik.http.routers.http-0-mpzxekpy8qkkf76rc700791e.rule=Host(`crawl.mitmore.dev`) && PathPrefix(`/`)
      - traefik.http.routers.http-0-mpzxekpy8qkkf76rc700791e.service=http-0-mpzxekpy8qkkf76rc700791e
      - traefik.http.routers.https-0-mpzxekpy8qkkf76rc700791e.entryPoints=https
      - traefik.http.routers.https-0-mpzxekpy8qkkf76rc700791e.middlewares=gzip
      - traefik.http.routers.https-0-mpzxekpy8qkkf76rc700791e.rule=Host(`crawl.mitmore.dev`) && PathPrefix(`/`)
      - traefik.http.routers.https-0-mpzxekpy8qkkf76rc700791e.service=https-0-mpzxekpy8qkkf76rc700791e
      - traefik.http.routers.https-0-mpzxekpy8qkkf76rc700791e.tls.certresolver=letsencrypt
      - traefik.http.routers.https-0-mpzxekpy8qkkf76rc700791e.tls=true
      - traefik.http.services.http-0-mpzxekpy8qkkf76rc700791e.loadbalancer.server.port=5000
      - traefik.http.services.https-0-mpzxekpy8qkkf76rc700791e.loadbalancer.server.port=5000

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: mitmore-seo-crawl-clickhouse
    restart: unless-stopped
    configs:
      - source: clickhouse_logging
        target: /etc/clickhouse-server/config.d/zz-disable-diagnostic-logs.xml
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE:-mitmore_seo_crawl}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  postgres:
    image: postgres:16-alpine
    container_name: mitmore-seo-crawl-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mitmore_seo_crawl}
      - POSTGRES_USER=${POSTGRES_USER:-librecrawl}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-librecrawl}
    volumes:
      - postgres_data:/var/lib/postgresql/data

configs:
  clickhouse_logging:
    content: |
      <clickhouse>
        <logger><level>warning</level><size>10M</size><count>2</count></logger>
        <trace_log remove="1" />
        <text_log remove="1" />
        <query_log remove="1" />
        <query_metric_log remove="1" />
        <aggregated_zookeeper_log remove="1" />
        <zookeeper_connection_log remove="1" />
        <zookeeper_log remove="1" />
        <delta_lake_metadata_log remove="1" />
        <iceberg_metadata_log remove="1" />
        <query_thread_log remove="1" />
        <query_views_log remove="1" />
        <part_log remove="1" />
        <metric_log remove="1" />
        <asynchronous_metric_log remove="1" />
        <processors_profile_log remove="1" />
        <opentelemetry_span_log remove="1" />
        <session_log remove="1" />
        <error_log remove="1" />
        <crash_log remove="1" />
        <backup_log remove="1" />
        <background_schedule_pool_log remove="1" />
        <asynchronous_insert_log remove="1" />
        <s3queue_log remove="1" />
        <blob_storage_log remove="1" />
      </clickhouse>

volumes:
  clickhouse_data:
  clickhouse_logs:
  postgres_data:
